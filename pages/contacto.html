<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contactanos</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="titulo">
          <img
            src="../img/logo.png"
            alt="logo de la compañía de un golden con la palabra pet-shop"
            class="logo"
          />
          <h1>Veterinaria | Petshop</h1>
        </div>
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="../pages/servicios.html">Servicios</a></li>
          <li><a href="contacto.html" class="active">contacto</a></li>
        </ul>
      </nav>
    </header>

    <main id="contacto">
      <img
        src="../img/logo.png"
        alt="logo de la compañía de un golden con la palabra pet-shop"
      />
      <h2>Contáctanos</h2>
      <p>¿Tienes alguna pregunta o necesitas más información?</p>
      <p><strong>¡No dudes en contactarnos!</strong></p>
      <form action="" class="contact-form">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required />

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

        <button type="submit" class="btn">Enviar</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Veterinaria | Petshop. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
